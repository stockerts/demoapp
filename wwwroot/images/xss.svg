  <path d="M52 110 L34 130 L52 150" stroke="#003366" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 110 L118 130 L100 150" stroke="#003366" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="86" y1="105" x2="66" y2="155" stroke="#003366" stroke-width="8" stroke-linecap="round"/>
  <!-- Injected script arrow bursting out -->
  <line x1="152" y1="130" x2="216" y2="80" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <polygon points="216,80 196,82 208,98" fill="#dc2626"/>
