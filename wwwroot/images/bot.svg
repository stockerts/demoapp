<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Antenna -->
  <line x1="120" y1="20" x2="120" y2="48" stroke="#003366" stroke-width="8" stroke-linecap="round"/>
  <circle cx="120" cy="16" r="8" fill="#003366"/>
  <!-- Robot head -->
  <rect x="42" y="48" width="156" height="130" rx="18" fill="#003366"/>
  <!-- Ear bolts -->
  <rect x="28" y="84" width="18" height="36" rx="5" fill="#003366"/>
  <rect x="194" y="84" width="18" height="36" rx="5" fill="#003366"/>
  <!-- Eye sockets -->
  <rect x="66" y="80" width="40" height="32" rx="8" fill="white" opacity="0.15"/>
  <rect x="134" y="80" width="40" height="32" rx="8" fill="white" opacity="0.15"/>
  <!-- Eyes (glowing) -->
  <circle cx="86" cy="96" r="10" fill="#60a5fa"/>
  <circle cx="154" cy="96" r="10" fill="#60a5fa"/>
  <!-- Mouth -->
  <rect x="72" y="136" width="96" height="12" rx="6" fill="white" opacity="0.3"/>
  <rect x="80" y="136" width="16" height="12" rx="0" fill="white" opacity="0.5"/>
  <rect x="104" y="136" width="16" height="12" rx="0" fill="white" opacity="0.5"/>
  <rect x="128" y="136" width="16" height="12" rx="0" fill="white" opacity="0.5"/>
  <!-- Success badge -->
  <circle cx="192" cy="48" r="32" fill="#16a34a"/>
  <polyline points="176,48 188,60 210,34" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
